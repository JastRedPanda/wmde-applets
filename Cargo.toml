[workspace]
default-members = ["cosmic-applets", "cosmic-panel-button"]
members = [
    "cosmic-app-list",
    "cosmic-app-list/cosmic-app-list-config",
    "cosmic-applets",
    "cosmic-applet-audio",
    "cosmic-applet-battery",
    "cosmic-applet-bluetooth",
    "cosmic-applet-minimize",
    "cosmic-applet-network",
    "cosmic-applet-notifications",
    "cosmic-applet-power",
    "cosmic-applet-status-area",
    "cosmic-applet-sysmon",
    "cosmic-applet-tiling",
    "cosmic-applet-time",
    "cosmic-applet-weather",
    "cosmic-applet-workspaces",
    "cosmic-panel-button",
    "cosmic-applet-input-sources",
    "cosmic-applet-a11y",
    "cosmic-applets-config",
    "wmde-sysmon",
]

resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d" }
cosmic-applets-config = { path = "cosmic-applets-config" }
wmde-sysmon = { path = "wmde-sysmon" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = [
    "client",
], rev = "c0cff4d" }

futures = "0.3"
futures-util = "0.3"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
libcosmic = { path = "../libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "desktop-systemd-scope",
    "winit",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
rust-embed = "8.11.0"
rust-embed-utils = "8.11.0"
rustc-hash = "2.1"
rustix = { version = "1.1", features = ["fs", "process"] }
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-log = "0.2.0"
tokio = { version = "1.49.0", features = ["full"] }
cosmic-config = { path = "../libcosmic/cosmic-config" }
serde = { version = "1.0.228", features = ["derive"] }
zlink = "0.5.0"

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
opt-level = 3
panic = "abort"
lto = "fat"
codegen-units = 1

[workspace.metadata.cargo-machete]
ignored = ["libcosmic"]

# Redirect the upstream libcosmic (and every crate it vendors: cosmic-config,
# cosmic-theme, and all the iced_* crates) to the local WMDE forks so this component
# links against the renamed fun.wmde.* config/theme ids, not upstream System76.
# Crate names are kept upstream on purpose, so the patch keys match.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

# Shared config crates read cross-component ids as exported consts (A.6). Point them
# at the WMDE sibling forks so the applets resolve the renamed fun.wmde.Comp id and
# the fun.wmde.Settings.Audio varlink socket, not the upstream System76 values.
[patch."https://github.com/pop-os/cosmic-comp"]
cosmic-comp-config = { path = "../wmde-comp/cosmic-comp-config" }

[patch."https://github.com/pop-os/cosmic-settings-daemon"]
cosmic-settings-audio-client = { path = "../wmde-settings-daemon/audio-client" }

# Notifications applet DND/config must reach the wmde-notifications daemon
# (fun.wmde.Notifications), not the upstream com.system76.CosmicNotifications id.
[patch."https://github.com/pop-os/cosmic-notifications"]
cosmic-notifications-config = { path = "../wmde-notifications/cosmic-notifications-config" }
cosmic-notifications-util = { path = "../wmde-notifications/cosmic-notifications-util" }

# Settings-daemon subscriptions (battery brightness, a11y) must talk to
# fun.wmde.SettingsDaemon; the WMDE settings fork rebranded these subscription crates.
[patch."https://github.com/pop-os/cosmic-settings"]
cosmic-settings-daemon-subscription = { path = "../wmde-settings/subscriptions/settings-daemon" }
cosmic-settings-upower-subscription = { path = "../wmde-settings/subscriptions/upower" }
cosmic-settings-a11y-manager-subscription = { path = "../wmde-settings/subscriptions/a11y-manager" }
cosmic-settings-accessibility-subscription = { path = "../wmde-settings/subscriptions/accessibility" }

[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }

# [patch.'https://github.com/pop-os/dbus-settings-bindings']
# cosmic-dbus-networkmanager = { path = "../dbus-settings-bindings/networkmanager" }
# upower_dbus = { path = "../dbus-settings-bindings/upower" }
# nm-secret-agent-manager = { path = "../dbus-settings-bindings/nm-secret-agent-manager" }

# WMDE: redirect standard D-Bus binding crates to the local wmde-dbus-settings-bindings
# fork (source-purity; these bind standard freedesktop/system services, identical to pop-os).
[patch."https://github.com/pop-os/dbus-settings-bindings"]
cosmic-dbus-a11y = { path = "../wmde-dbus-settings-bindings/a11y" }
cosmic-dbus-networkmanager = { path = "../wmde-dbus-settings-bindings/networkmanager" }
mpris2-zbus = { path = "../wmde-dbus-settings-bindings/mpris2" }
nm-secret-agent-manager = { path = "../wmde-dbus-settings-bindings/nm-secret-agent-manager" }
switcheroo-control = { path = "../wmde-dbus-settings-bindings/switcheroo-control" }
timedate-zbus = { path = "../wmde-dbus-settings-bindings/timedate" }
upower_dbus = { path = "../wmde-dbus-settings-bindings/upower" }

# WMDE: redirect the panel config crates to the local wmde-panel fork.
[patch."https://github.com/pop-os/cosmic-panel"]
cosmic-panel-config = { path = "../wmde-panel/cosmic-panel-config" }
xdg-shell-wrapper-config = { path = "../wmde-panel/xdg-shell-wrapper-config" }
